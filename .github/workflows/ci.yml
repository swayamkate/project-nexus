name: MahaSkill Track Enterprise CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Code Quality, Security Audit & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Type Check Root Portal
        run: npx tsc --noEmit

      - name: Build Root Portal
        run: npm run build

      - name: Install & Type Check Admin Console
        working-directory: ./admin-app
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
